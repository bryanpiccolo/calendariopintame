<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Calendário Pinta Me · Equipe</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"><style>
[hidden]{display:none!important}
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#F0F2F8; --ink:#1D2140; --muted:#5F6582; --line:#E2E5EF;
  --accent:#3452F5; --accent-ink:#FFFFFF; --accent-soft:#E8ECFF;
  --late:#C8303F; --late-bg:#FDECEE; --soon:#A26A0C; --soon-bg:#FFF3D9;
  --done:#17805A; --done-bg:#E1F4EB; --na:#7A7F99; --na-bg:#EEF0F5;
  --weekend:#F1F3F9; --today:#E8467C; --shadow:0 1px 2px rgba(29,33,64,.06),0 6px 20px rgba(29,33,64,.06);
  --display:"Fredoka","Nunito Sans",ui-rounded,system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111327; --surface:#1A1D36; --surface-2:#22264A; --ink:#ECEEFA; --muted:#A1A6C4; --line:#2D3156;
    --accent:#8397FF; --accent-ink:#111327; --accent-soft:#262C5C;
    --late:#FF7482; --late-bg:#3B1C28; --soon:#F4BE55; --soon-bg:#3A2D14;
    --done:#52D09A; --done-bg:#15352A; --na:#8F94B4; --na-bg:#24284A;
    --weekend:#161933; --today:#FF6FA0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111327; --surface:#1A1D36; --surface-2:#22264A; --ink:#ECEEFA; --muted:#A1A6C4; --line:#2D3156;
  --accent:#8397FF; --accent-ink:#111327; --accent-soft:#262C5C;
  --late:#FF7482; --late-bg:#3B1C28; --soon:#F4BE55; --soon-bg:#3A2D14;
  --done:#52D09A; --done-bg:#15352A; --na:#8F94B4; --na-bg:#24284A;
  --weekend:#161933; --today:#FF6FA0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 60px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(24px,4vw,32px);line-height:1.1}
h2{font-size:20px}
h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:6px}
.markers{display:flex;gap:4px}
.markers i{width:22px;height:6px;border-radius:3px;display:block}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}
.tile .big{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1}
.tile .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tile.late .big{color:var(--late)}
.tile.soon .big{color:var(--soon)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--done);border-radius:3px}
@media (max-width:820px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--late-bg);color:var(--late)}
.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}

/* timeline */
.tl-nav{display:flex;gap:6px;align-items:center}
.tl-scroll{overflow-x:auto;position:relative}
.tl{position:relative}
.tl-row{display:flex;position:relative}
.tl-lab{position:sticky;left:0;z-index:3;width:170px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;min-height:52px}
.tl-lab b{font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.tl-lab span{font-size:12px;color:var(--muted)}
.tl-track{position:relative;flex:none}
.tl-head .tl-lab{min-height:0}
.tl-months{display:flex;height:26px}
.tl-months div{border-left:1px solid var(--line);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:5px 8px;color:var(--muted);white-space:nowrap;overflow:hidden}
.tl-days{display:flex;height:22px;border-bottom:1px solid var(--line)}
.tl-days div{flex:none;text-align:center;font-size:10px;color:var(--muted);line-height:22px}
.tl-days div.we{background:var(--weekend)}
.tl-days div.td{background:var(--today);color:#fff;border-radius:4px;font-weight:800}
.tl-body .tl-row{border-bottom:1px solid var(--line)}
.tl-bg{position:absolute;inset:0;display:flex;pointer-events:none}
.tl-bg div{flex:none;height:100%}
.tl-bg div.we{background:var(--weekend)}
.tl-bg div.m1{border-left:1px solid var(--line)}
.prep{position:absolute;top:14px;height:24px;border-radius:12px 0 0 12px;opacity:.9}
.camp{position:absolute;top:10px;height:32px;border-radius:9px;padding:0 10px;display:flex;align-items:center;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.dot{position:absolute;top:21px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);transform:translateX(-50%);z-index:2;cursor:pointer}
.dot.late{background:var(--late)} .dot.soon{background:var(--soon)} .dot.ok{background:var(--muted)} .dot.done{background:var(--done)} .dot.na{background:var(--na-bg);border-color:var(--na)}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:2;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.hatch{width:22px;border-radius:5px}

/* task list */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel{border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:8px;font-size:13px;max-width:100%}
.group{display:flex;flex-direction:column}
.group-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.swatch{width:14px;height:14px;border-radius:4px;flex:none}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 170px 34px;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task .nm{font-weight:600;line-height:1.3}
.task .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.task.is-done .nm,.task.is-na .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ck.on{background:var(--done);border-color:var(--done)}
.ck.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.due{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.pill{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.late{background:var(--late-bg);color:var(--late)} .pill.soon{background:var(--soon-bg);color:var(--soon)}
.pill.ok{background:var(--surface-2);color:var(--muted)} .pill.done{background:var(--done-bg);color:var(--done)} .pill.na{background:var(--na-bg);color:var(--na)}
.dlabel{font-size:12px;color:var(--muted)}
.iconbtn{border:none;background:none;width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:18px;line-height:1}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:32px;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:200px;padding:4px}
.menu-pop button{text-align:left;background:none;border:none;padding:8px 10px;border-radius:7px;font-size:14px}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop label{padding:6px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.addx{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;align-items:center;background:var(--surface-2);border-radius:0 0 14px 14px}
.addx input,.addx select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.addx input[type=text]{flex:1 1 220px;min-width:0}
.addx input[type=number]{width:80px}
@media (max-width:760px){
  .task{grid-template-columns:28px minmax(0,1fr) 34px;row-gap:6px}
  .task .owner,.task .due{grid-column:2/3}
  .task .menu{grid-row:1;grid-column:3}
}

/* upcoming */
.up{display:flex;flex-direction:column}
.up-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.up-row:last-child{border-bottom:none}
.up-row .who{font-size:12px;color:var(--muted)}

/* cobranças */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.person{display:flex;flex-direction:column}
.person-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;color:#fff;flex:none}
.person ul{list-style:none;margin:0;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.person li{display:flex;justify-content:space-between;gap:10px;font-size:14px;line-height:1.3}
.msg{margin:0 16px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;white-space:pre-wrap;user-select:all;max-height:160px;overflow:auto}
.person-f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.person-f a{text-decoration:none}
.ok-empty{padding:14px 16px;color:var(--done);font-weight:700;font-size:14px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 16px;font-size:14px}

/* config */
.cfg-table{overflow-x:auto}
.cfg-table table{border-collapse:collapse;width:100%;min-width:760px}
.cfg-table th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:800}
.cfg-table td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.cfg-table input[type=text],.cfg-table input[type=email],.cfg-table input[type=tel],.cfg-table input[type=number],.cfg-table select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:14px}
.cfg-table input[type=number]{width:72px}
.phase{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.savebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;padding:12px 16px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(17,19,39,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column}
.modal form{display:flex;flex-direction:column;gap:14px;padding:18px 20px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:15px;font-weight:400;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}
.err{color:var(--late);font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:60}
.tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--soon-bg);color:var(--soon)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.dt-wrap{overflow-x:auto}
.dt{position:relative}
.dt-row{display:flex;border-bottom:1px solid var(--line)}
.dt-lab{position:sticky;left:0;z-index:3;width:250px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.dt-lab b{font-size:14px;line-height:1.25}
.dt-lab span{font-size:12px;color:var(--muted)}
.dt-track{position:relative;flex:none;min-height:46px}
.dt-bar{position:absolute;top:50%;transform:translateY(-50%);height:24px;border-radius:7px;color:#fff;font-size:12px;font-weight:800;line-height:24px;padding:0 8px;white-space:nowrap;overflow:hidden}
.dt-bar.late{box-shadow:0 0 0 2px var(--late)}
.dt-bar.done{opacity:.4}
.dt-head{display:flex;height:40px;border-bottom:1px solid var(--line)}
.dt-hm{position:absolute;top:0;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 6px;border-left:1px solid var(--line);height:40px;white-space:nowrap}
.dt-hw{position:absolute;top:22px;font-size:10px;color:var(--muted);padding-left:3px;border-left:1px solid var(--line);height:18px}
.dt-vline{position:absolute;top:0;bottom:0;width:2px;z-index:2;pointer-events:none}
.dt-vlab{position:absolute;top:2px;font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;color:#fff;white-space:nowrap;z-index:4;transform:translateX(-50%)}
.et{display:grid;grid-template-columns:28px minmax(180px,1fr) 150px 90px 150px 170px 34px;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);min-width:900px}
.et.hd{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.et input[type=date],.et input[type=number],.et input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px;width:100%}
.et .nm small{display:block;color:var(--muted);font-size:12px}
.et.is-done .nm b,.et.is-na .nm b{color:var(--muted);text-decoration:line-through}
.addet{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 16px;background:var(--surface-2);border-radius:0 0 14px 14px}
.addet label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.addet input[type=text],.addet input[type=date],.addet input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px}
.clickable{cursor:pointer}
.obs{display:block;margin-top:3px;font-size:12.5px;line-height:1.4;color:var(--muted);font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}
.obs-tg{border:none;background:none;padding:0 3px;font-size:13px;cursor:pointer;border-radius:5px;line-height:1.3}
.obs-tg:hover{background:var(--surface-2)}
.obs-tg[aria-expanded="false"]{opacity:.8}
.obs-c{flex-basis:100%;font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.owner-btn{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-weight:600}
.owner-btn:hover{border-color:var(--accent)}
.addet label>span{display:flex;flex-wrap:wrap;gap:4px 12px;max-width:420px}
.addet .ochk{display:inline-flex;margin:0}
.seg-t{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg-t button{border:none;background:none;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg-t button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cph{position:absolute;height:13px;border-radius:4px;font-size:10px;font-weight:800;line-height:13px;padding:0 5px;white-space:nowrap;overflow:hidden;color:#fff;cursor:pointer}
.cph.late{box-shadow:0 0 0 2px var(--late)}
.cph.done{opacity:.4}
.launch{position:absolute;width:14px;height:14px;transform:translateX(-50%) rotate(45deg);border:2px solid var(--surface);z-index:2}
.launch-l{position:absolute;font-size:11px;font-weight:800;white-space:nowrap;color:var(--ink);z-index:2}
.ctype{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ochk{display:inline-flex;align-items:center;gap:4px;font-size:13px;margin-right:10px;white-space:nowrap}
.empty{padding:36px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tab{transition:border-color .15s,background .15s}}
</style></head><body><div class="wrap">
  <header class="top">

      <div class="markers" aria-hidden="true"><i style="background:#E8467C"></i><i style="background:#2D7FF9"></i><i style="background:#F5A500"></i><i style="background:#16A673"></i><i style="background:#7B5CFF"></i></div>
      <h1>Calendário Pinta Me</h1>
      <div class="muted small" id="status-line">Carregando…</div>
    </div>
    <div class="hbtns"><button class="btn ghost" id="undo" type="button" disabled title="Desfazer (Ctrl+Z)">↶ Desfazer</button><button class="btn ghost" id="redo" type="button" disabled title="Refazer (Ctrl+Shift+Z)">↷ Refazer</button><button class="btn ghost" id="export-team" type="button" hidden title="Gera o arquivo index.html só de visualização para subir no GitHub">⬇ Versão da equipe</button><button class="btn" id="new-col" type="button">+ Nova coleção</button><button class="btn primary" id="new-camp" type="button">+ Nova campanha</button></div>
  </header>

  <section class="summary" id="summary" aria-label="Resumo"></section>

  <nav class="tabs" role="tablist">

<div class="toast" id="toast" hidden></div><script>window.__PM_SNAP_URL__="dados.json"</script><script>
(function(){
const COLORS=["#E8467C","#2D7FF9","#F5A500","#16A673","#FF7A2F","#7B5CFF","#12A4B8"];
const AVATAR=["#E8467C","#2D7FF9","#16A673","#FF7A2F","#7B5CFF","#12A4B8","#C98A00"];
const PHASES={planejamento:"Planejamento",criacao:"Criação",execucao:"Execução",pos:"Pós-campanha",colecao:"Coleção"};
const COLPH=["#7B5CFF","#2D7FF9","#FF7A2F","#16A673","#E8467C","#12A4B8","#C98A00"];
const DAY=86400000;
const ZW={4:20,6:13,12:6};

let db=null, canWrite=true, ready=false;
let SNAP=window.__PM_SNAP__||null;const SNAP_URL=window.__PM_SNAP_URL__||null, TEAM=!!(SNAP||SNAP_URL);
if(TEAM) canWrite=false;
const UIKEY=TEAM?"pmm-team-ui":"pmm-camp-ui";
const SRC=(()=>{try{const q=x=>document.querySelector(x);const st=[...document.querySelectorAll("style")].find(x=>x.textContent.includes(".wrap"));const sc=[...document.scripts].find(x=>x.textContent.includes("__PM_SNAP__")&&x.textContent.includes("UIKEY"));
  return {css:st?st.outerHTML:"",body:q(".wrap").outerHTML+q("#overlay").outerHTML+q("#toast").outerHTML,js:sc?sc.textContent:""}}catch(e){return null}})();
let campaigns=[], statusMap={}, team=[], templates=[], colTemplates=[];
let got={c:false,s:false,t:false,m:false,k:false};
let view="calendario", tlOffset=0, openMenu=null, zoom=12, showObs=true, obsFlip=new Set();
let filt={person:"all",camp:"all",show:"abertas",tipo:"tudo"};
let cfgDraft=null, cfgDirty=false;
let editing=null, editTipo="campanha", delArm=false, pickColor=COLORS[0];
let addxOpen=null, detail=null, detMenu=null, etEdit=null;

try{const s=JSON.parse(localStorage.getItem(UIKEY)||"{}"); if(s.filt) filt=Object.assign(filt,s.filt); if(s.view) view=s.view; if(ZW[s.zoom]) zoom=s.zoom; if(s.showObs===false) showObs=false;}catch(e){}
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify({filt,view,zoom,showObs}))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseD(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function diff(a,b){return Math.round((a-b)/DAY)}
function br(d){return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","")}
function brFull(d){return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}
function inkOn(hex){const h=hex.replace("#","");const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return (0.299*r+0.587*g+0.114*b)>165?"#1D2140":"#FFFFFF"}
function rid(){return Math.random().toString(36).slice(2,9)}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}
function person(id){return team.find(p=>p.id===id)}
function pname(id){return person(id)?.name||"Sem responsável"}
function pcolor(id){const i=team.findIndex(p=>p.id===id);return AVATAR[(i<0?0:i)%AVATAR.length]}
const isCol=c=>c&&c.tipo==="colecao";
const tipoOk=c=>filt.tipo==="tudo"||(filt.tipo==="colecoes")===isCol(c);
function namesOf(ids){const n=ids.map(pname);return n.length>1?n.slice(0,-1).join(", ")+" e "+n[n.length-1]:(n[0]||"Sem responsável")}
function defOwners(t){return (t.owners&&t.owners.length)?t.owners:(t.owner?[t.owner]:[])}
function tipoSeg(){return `<div class="seg-t" role="group" aria-label="Mostrar">${[["tudo","Tudo"],["campanhas","Campanhas"],["colecoes","Coleções"]].map(([v,l])=>`<button type="button" data-tipo="${v}" aria-pressed="${filt.tipo===v}">${l}</button>`).join("")}</div>`}
const DIAS=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function wdOf(t){if(t.weekday!==undefined&&t.weekday!==null&&t.weekday!=="")return Number(t.weekday);return t.snap?1:null}
function isAfter(t){return t.anchor==="fim"&&Number(t.days)<0}
function dlabel(t){const b=dlabel0(t),wd=wdOf(t);if(wd==null)return b;return isAfter(t)?`1ª ${DIAS[wd]} após `+(Number(t.days)===-1?"o fim":b):`${DIAS[wd]} até ${b}`}
function dlabel0(t){if(t.anchor==="lanc"){const d=Number(t.days||0);return d>0?`${d} dias antes do lançamento`:(d===0?"no lançamento":`${-d} dias após o lançamento`)}const d=Number(t.days||0);if(t.anchor==="fim")return d===0?"no último dia":(d>0?`${d}d antes do fim`:`${-d}d após o fim`);return d===0?"Dia D":(d>0?`D-${d}`:`D+${-d}`)}

function allTasks(){
  const out=[];
  for(const c of campaigns){
    const start=parseD(c.start), end=parseD(c.end); if(!start||!end) continue;
    const list=(isCol(c)?colTemplates:templates).filter(t=>t.active!==false).map(t=>Object.assign({},t,{src:"m"})).concat((c.extras||[]).map(t=>Object.assign({},t,{src:"x"})));
    for(const t of list){
      const sid=c.id+"__"+t.key, st=statusMap[sid]||{};
      const anchor=t.anchor==="fim"?end:start;
      let due=st.due?parseD(st.due):addDays(anchor,-Number(t.days||0));
      const wd=wdOf(t);
      if(!st.due&&wd!=null) due=isAfter(t)?addDays(due,(wd-due.getDay()+7)%7):addDays(due,-((due.getDay()-wd+7)%7));
      if(!st.due) due=isAfter(t)?bizFwd(due):bizBack(due);
      const dur=st.dur!=null?Number(st.dur):Number(t.dur||0);
      const startD=dur>0?bizBack(addDays(due,-dur)):null;
      const owners=(st.owners&&st.owners.length)?st.owners:st.owner?[st.owner]:defOwners(t);
      out.push({sid,camp:c,tpl:t,name:st.name||t.name,phase:t.phase||(isCol(c)?"colecao":"execucao"),owners,owner:owners[0]||"",due,dur,start:startD,startedAt:st.startedAt||null,critica:!!t.critica,obs:st.obs||t.obs||"",state:st.state||"pendente",doneAt:st.doneAt,custom:!!(st.due||st.dur!=null||st.name||(st.owners&&st.owners.length))});
    }
  }
  return out;
}
function bizBack(d){const g=d.getDay();return g===6?addDays(d,-1):g===0?addDays(d,-2):d}
function bizFwd(d){const g=d.getDay();return g===6?addDays(d,2):g===0?addDays(d,1):d}
function dayOf(v){if(!v)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(v))return parseD(v);const x=new Date(v);return new Date(x.getFullYear(),x.getMonth(),x.getDate())}
function colRisk(c,tasks){const t=today();let best=null;
  for(const k of tasks.filter(k=>k.camp.id===c.id&&k.critica&&k.state!=="na")){
    let d=0,why="";
    if(k.state==="feito"){d=k.doneAt?diff(dayOf(k.doneAt),k.due):0;why="terminou depois do prazo"}
    else if(k.state==="andamento"){const sa=dayOf(k.startedAt)||t;const a=k.start?diff(sa,k.start):0,b=diff(t,k.due);d=Math.max(a,b);why=a>=b?`começou em ${brFull(sa)}, ${a} dia(s) depois do previsto`:`passou do prazo de entrega`}
    else if(k.start){d=diff(t,k.start);why=`ainda não começou (deveria ter começado em ${brFull(k.start)})`}
    if(d>0&&(!best||d>best.delay))best={delay:d,k,why}}
  if(!best)return null;best.proj=bizFwd(addDays(parseD(c.start),best.delay));return best}
function tstat(t){
  if(t.state==="feito") return {cls:"done",label:"Feita"};
  if(t.state==="na") return {cls:"na",label:"Não se aplica"};
  const d=diff(t.due,today());
  if(t.start&&t.state!=="andamento"){const ds=diff(t.start,today());if(ds<0)return {cls:"late",label:`Não iniciada (${-ds}d)`};if(ds===0)return {cls:"soon",label:"Começa hoje"};if(ds<=2)return {cls:"soon",label:`Começa em ${ds}d`}}
  if(t.state==="andamento"&&d>3) return {cls:"ok",label:"Em andamento"};
  if(d<0) return {cls:"late",label:`Atrasada ${-d}d`};
  if(d===0) return {cls:"soon",label:"Vence hoje"};
  if(d===1) return {cls:"soon",label:"Vence amanhã"};
  if(d<=3) return {cls:"soon",label:`Vence em ${d}d`};
  return {cls:"ok",label:`Em ${d} dias`};
}
const isOpen=t=>t.state!=="feito"&&t.state!=="na";
const isLate=t=>isOpen(t)&&tstat(t).cls==="late";
function campPhase(c){const t=today(),s=parseD(c.start),e=parseD(c.end);if(t>e)return"encerrada";if(t>=s)return"no ar";return"próxima"}

/* ---------- render ---------- */
function render(){
  const tasks=allTasks().filter(k=>tipoOk(k.camp));
  renderSummary(tasks);
  const late=tasks.filter(t=>isLate(t)).length;
  const lc=$("#late-count"); lc.hidden=!late; lc.textContent=late;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));
  ["calendario","tarefas","cobrancas","config"].forEach(v=>$("#v-"+v).hidden=v!==view);
  if(view==="calendario"){const dc=detail&&campaigns.find(c=>c.id===detail);if(dc)renderDetail(dc,allTasks());else{detail=null;renderCal(tasks)}}
  if(view==="tarefas") renderTasks(tasks);
  if(view==="cobrancas") renderCob(tasks);
  if(view==="config") renderCfg();
  $("#new-camp").disabled=!canWrite||!db;$("#new-col").disabled=!canWrite||!db;paintHist();
}

function renderSummary(tasks){
  const t=today();
  const cs=campaigns.filter(tipoOk);
  const live=cs.filter(c=>campPhase(c)==="no ar").sort((a,b)=>a.end<b.end?-1:1);
  const next=cs.filter(c=>campPhase(c)==="próxima").sort((a,b)=>a.start<b.start?-1:1)[0];
  let t1;
  if(next){const d=diff(parseD(next.start),t);t1=`<div class="lbl">Próximo lançamento</div><div class="big num">${d===1?"amanhã":"em "+d+" dias"}</div><div class="sub">${esc(next.name)} · ${isCol(next)?"coleção · "+br(parseD(next.start)):br(parseD(next.start))+" → "+br(parseD(next.end))}${live.length?` · no ar agora: ${esc(live[0].name)}`:""}</div>`}
  else if(live.length){t1=`<div class="lbl">No ar agora</div><div class="big">${esc(live[0].name)}</div><div class="sub">até ${br(parseD(live[0].end))}</div>`}
  else t1=`<div class="lbl">Próximo lançamento</div><div class="big">—</div><div class="sub">Nada futuro cadastrado</div>`;
  const open=tasks.filter(isOpen);
  const late=open.filter(x=>isLate(x));
  const week=open.filter(x=>{const d=diff(x.due,t);return d>=0&&d<=7});
  const lateP=[...new Set(late.flatMap(x=>x.owners))].map(pname);
  let prog="";
  const focus=next||live[0];
  if(focus){const ft=tasks.filter(x=>x.camp.id===focus.id&&x.state!=="na");const dn=ft.filter(x=>x.state==="feito").length;const pct=ft.length?Math.round(dn/ft.length*100):0;
    prog=`<div class="lbl">Preparação · ${esc(focus.name)}</div><div class="big num">${pct}%</div><div class="sub num">${dn} de ${ft.length} tarefas feitas</div><div class="bar"><span style="width:${pct}%"></span></div>`}
  else prog=`<div class="lbl">Preparação</div><div class="big">—</div><div class="sub">Cadastre uma campanha ou coleção</div>`;
  $("#summary").innerHTML=`<div class="tile">${t1}</div>
   <div class="tile late"><div class="lbl">Atrasadas</div><div class="big num">${late.length}</div><div class="sub">${late.length?esc(lateP.join(", ")):"Tudo em dia"}</div></div>
   <div class="tile soon"><div class="lbl">Vencem em 7 dias</div><div class="big num">${week.length}</div><div class="sub">${week.length?"até "+br(addDays(t,7)):"Nada para esta semana"}</div></div>
   <div class="tile">${prog}</div>`;
}

function renderCal(tasks){
  const t=today();
  const start=new Date(t.getFullYear(),t.getMonth()+tlOffset,1);
  const DW=ZW[zoom], big=DW>=13;
  const end=new Date(start.getFullYear(),start.getMonth()+zoom,0);
  const n=diff(end,start)+1, W=n*DW;
  const months=[];for(let i=0;i<zoom;i++){const m=new Date(start.getFullYear(),start.getMonth()+i,1);const days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();months.push({label:m.toLocaleDateString("pt-BR",big?{month:"long",year:"numeric"}:{month:"short",year:"2-digit"}).replace(".",""),w:days*DW})}
  let dayCells="",bgCells="";
  if(big){for(let i=0;i<n;i++){const d=addDays(start,i);const we=d.getDay()===0||d.getDay()===6;const td=diff(d,t)===0;dayCells+=`<div style="width:${DW}px" class="${we?"we":""} ${td?"td":""}">${d.getDate()}</div>`;bgCells+=`<div style="width:${DW}px" class="${we?"we":""} ${d.getDate()===1?"m1":""}"></div>`}}
  else{for(const m of months){bgCells+=`<div style="width:${m.w}px" class="m1"></div>`;}
    for(let i=0;i<n;i++){const d=addDays(start,i);if(d.getDay()===1){const td=diff(t,d);const wk=Math.min(7,n-i);dayCells+=`<div style="width:${wk*DW}px;text-align:left;padding-left:2px;border-left:1px solid var(--line)" class="${td>=0&&td<7?"td":""}">${d.getDate()}</div>`;i+=6}else{dayCells+=`<div style="width:${DW}px"></div>`}}}
  const x=d=>diff(d,start)*DW;
  const firstOf=c=>tasks.filter(k=>k.camp.id===c.id).reduce((a,k)=>{const b=addDays(k.due,-k.dur);return b<a?b:a},parseD(c.start));
  const vis=campaigns.filter(tipoOk).filter(c=>{const e=parseD(c.end);return e>=start&&firstOf(c)<=end}).sort((a,b)=>{const fa=isCol(a)?firstOf(a):parseD(a.start),fb=isCol(b)?firstOf(b):parseD(b.start);return fa-fb});
  let rows="";
  for(const c of vis){
    if(isCol(c)){rows+=colRow(c,tasks,x,W,bgCells,t);continue}
    const s=parseD(c.start),e=parseD(c.end),col=c.color||COLORS[0];
    const ct=tasks.filter(k=>k.camp.id===c.id);
    const first=ct.reduce((a,k)=>k.due<a?k.due:a,s);
    const cl=Math.max(0,x(s)),cr=Math.min(W,x(addDays(e,1)));
    const pl=Math.max(0,x(first)),pr=Math.min(W,x(s));
    const prep=pr>pl?`<div class="prep" style="left:${pl}px;width:${pr-pl}px;background:repeating-linear-gradient(135deg,${col}33 0 6px,${col}14 6px 12px)"></div>`:"";
    const bar=cr>cl?`<div class="camp" data-edit="${c.id}" style="left:${cl}px;width:${cr-cl}px;background:${col};color:${inkOn(col)}" title="${esc(c.name)}: ${br(s)} a ${br(e)}${c.mecanica?" — "+esc(c.mecanica):""}${c.notas?" — "+esc(c.notas):""}">${esc(c.name)}</div>`:"";
    let dots="";
    for(const k of ct){const px=x(k.due)+DW/2;if(px<0||px>W)continue;const st=tstat(k);dots+=`<span class="dot ${st.cls}" data-goto="${c.id}" style="left:${px}px" title="${esc(k.name)} — ${esc(namesOf(k.owners))} — ${brFull(k.due)} (${st.label})"></span>`}
    const openN=ct.filter(isOpen).length, lateN=ct.filter(k=>isLate(k)).length;
    rows+=`<div class="tl-row"><div class="tl-lab"><b data-edit="${c.id}">${esc(c.name)}</b><span>${br(s)} → ${br(e)}${lateN?` · <span style="color:var(--late);font-weight:800">${lateN} atrasada${lateN>1?"s":""}</span>`:openN?` · ${openN} abertas`:" · pronta"}</span></div><div class="tl-track" style="width:${W}px;height:52px"><div class="tl-bg">${bgCells}</div>${prep}${bar}${dots}</div></div>`;
  }
  const tx=diff(t,start);const todayLine=(tx>=0&&tx<n)?`<div class="today-line" style="left:${170+tx*DW+DW/2-1}px"></div>`:"";
  const body=vis.length?rows:`<div class="tl-row"><div class="tl-lab"><span>Nada neste período</span></div><div class="tl-track" style="width:${W}px;height:52px"><div class="tl-bg">${bgCells}</div></div></div>`;
  // upcoming deliveries
  const up=tasks.filter(k=>isOpen(k)&&diff(k.due,t)<=7).sort((a,b)=>a.due-b.due).slice(0,10);
  const upHtml=up.length?up.map(k=>{const st=tstat(k);return `<div class="up-row"><div><div style="font-weight:600;line-height:1.3">${esc(k.name)}</div><div class="who"><span class="swatch" style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${k.camp.color||COLORS[0]}"></span> ${esc(k.camp.name)} · ${esc(namesOf(k.owners))} · ${brFull(k.due)}</div></div><span class="pill ${st.cls}">${st.label}</span></div>`}).join(""):`<div class="ok-empty">Nenhuma entrega atrasada ou para os próximos 7 dias.</div>`;
  $("#v-calendario").innerHTML=`
   <div class="card">
     <div class="card-h"><h2>Linha do tempo</h2>${tipoSeg()}<div class="tl-nav"><div class="seg-t" role="group" aria-label="Período">${[[4,"4 meses"],[6,"6 meses"],[12,"1 ano"]].map(([v,l])=>`<button type="button" data-zoom="${v}" aria-pressed="${zoom===v}">${l}</button>`).join("")}</div>${years().map(y=>`<button class="btn sm" data-year="${y}" type="button">${y}</button>`).join("")}<button class="btn sm" data-tl="-1" type="button" aria-label="Voltar">←</button><button class="btn sm" data-tl="0" type="button">Hoje</button><button class="btn sm" data-tl="1" type="button" aria-label="Avançar">→</button></div></div>
     <div class="tl-scroll" id="tl-scroll"><div class="tl" style="width:${170+W}px">
       <div class="tl-row tl-head"><div class="tl-lab" style="border-bottom:1px solid var(--line)"><span>${filt.tipo==="colecoes"?"Coleção":filt.tipo==="campanhas"?"Campanha":"Campanha / coleção"}</span></div><div class="tl-track" style="width:${W}px"><div class="tl-months">${months.map(m=>`<div style="width:${m.w}px">${m.label}</div>`).join("")}</div><div class="tl-days">${dayCells}</div></div></div>
       <div class="tl-body">${body}</div>${todayLine}
     </div></div>

function cobMsg(p,list){

/* ---------- writes ---------- */
async function w(fn,okMsg){
  if(!db||!canWrite){toast("Sem permissão para editar");return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    if(e&&e.code==="invalid_argument"){canWrite=false;render();toast("Você tem acesso só de leitura")}
    else if(e&&e.code==="unavailable"){try{await new Promise(r=>setTimeout(r,500+Math.random()*700));await fn();if(okMsg)toast(okMsg);return true}catch(e2){toast("Não salvou — tente de novo")}}
    else if(e&&e.code==="quota_exceeded"){toast("Limite de dados atingido: exclua campanhas antigas")}
    else toast("Não salvou — tente de novo");
    return false;
  }
}
/* ---------- histórico (desfazer/refazer) ---------- */
let hist=[],redoS=[],grp=null;
const clone=v=>v==null?null:JSON.parse(JSON.stringify(v));
function getLocal(path){const [c,id]=path.split("/");let v=null;
  if(c==="status")v=statusMap[id]||null;
  else if(c==="campaigns"){const x=campaigns.find(z=>z.id===id);if(x){v=Object.assign({},x);delete v.id}}
  else if(c==="config")v=id==="equipe"?{people:team}:id==="modelo"?{tasks:templates}:id==="modeloColecao"?{tasks:colTemplates}:null;
  return clone(v)}
function applyLocal(path,data){const [c,id]=path.split("/");
  if(c==="status"){if(data==null)delete statusMap[id];else statusMap[id]=clone(data)}
  else if(c==="campaigns"){const i=campaigns.findIndex(z=>z.id===id);if(data==null){if(i>=0)campaigns.splice(i,1)}else{const v=Object.assign({id},clone(data));if(i>=0)campaigns[i]=v;else campaigns.push(v)}}
  else if(c==="config"&&data){if(id==="equipe")team=clone(data.people)||[];if(id==="modelo")templates=clone(data.tasks)||[];if(id==="modeloColecao")colTemplates=clone(data.tasks)||[]}}
async function putDoc(path,data){applyLocal(path,data);if(data==null)await db.doc(path).delete();else await db.doc(path).set(data)}
function paintHist(){const u=$("#undo"),r=$("#redo");if(!u)return;u.disabled=!hist.length||!canWrite;r.disabled=!redoS.length||!canWrite;u.title=hist.length?"Desfazer: "+hist[hist.length-1].label+" (Ctrl+Z)":"Nada para desfazer";r.title=redoS.length?"Refazer: "+redoS[redoS.length-1].label+" (Ctrl+Shift+Z)":"Nada para refazer"}
function record(ops,label){if(!ops.length)return;if(grp){grp.ops.push(...ops);return}hist.push({label,ops});if(hist.length>60)hist.shift();redoS=[];paintHist()}
function group(label,fn){grp={label,ops:[]};try{fn()}finally{const g=grp;grp=null;record(g.ops,g.label)}}
function commit(list,label,okMsg){
  const ops=list.map(o=>({path:o.path,before:o.before!==undefined?clone(o.before):getLocal(o.path),after:clone(o.data)}));
  record(ops,label);
  return w(async()=>{for(const o of ops)await putDoc(o.path,o.after)},okMsg).then(ok=>{if(!ok){const i=hist.findIndex(h=>h.ops.includes(ops[0]));if(i>=0){hist[i].ops=hist[i].ops.filter(o=>!ops.includes(o));if(!hist[i].ops.length)hist.splice(i,1)}paintHist()}return ok})}
async function undo(){const e=hist.pop();if(!e)return;paintHist();const ok=await w(async()=>{for(const o of [...e.ops].reverse())await putDoc(o.path,o.before)});if(ok){redoS.push(e);toast("Desfeito: "+e.label)}else hist.push(e);cfgDirty=false;render()}
async function redo(){const e=redoS.pop();if(!e)return;paintHist();const ok=await w(async()=>{for(const o of e.ops)await putDoc(o.path,o.after)});if(ok){hist.push(e);toast("Refeito: "+e.label)}else redoS.push(e);cfgDirty=false;render()}
function setStatus(sid,patch,label){
  const cur=statusMap[sid]||null;const next=Object.assign({},cur||{},patch,{updatedAt:new Date().toISOString()});
  for(const k of Object.keys(next)) if(next[k]===undefined||next[k]===null) delete next[k];
  const k=allTasks().find(z=>z.sid===sid);
  statusMap[sid]=next;render();
  return commit([{path:"status/"+sid,data:next,before:cur}],label||("alteração em “"+(k?shortName(k.name):"tarefa")+"”"));
}
function saveExtras(cid,extras,msg,label){const before=getLocal("campaigns/"+cid);const c=campaigns.find(x=>x.id===cid);c.extras=extras;const data=Object.assign({},before,{extras});render();return commit([{path:"campaigns/"+cid,data,before}],label||"etapa extra",msg)}

function paintColors(){$("#f-colors").innerHTML=COLORS.map(c=>`<button type="button" style="background:${c}" data-color="${c}" aria-pressed="${c===pickColor}" aria-label="Cor ${c}"></button>`).join("")}
function closeModal(){$("#overlay").hidden=true;editing=null}
async function saveModal(){
  const col=editTipo==="colecao";
  const name=$("#f-name").value.trim(),start=$("#f-start").value,end=col?$("#f-start").value:$("#f-end").value;
  const err=$("#f-err");
  if(!name){err.textContent="Dê um nome.";err.hidden=false;return}
  if(!start||!end){err.textContent=col?"Preencha a data de lançamento.":"Preencha as datas de início e fim.";err.hidden=false;return}
  if(end<start){err.textContent="A data de fim precisa ser igual ou depois do início.";err.hidden=false;return}
  const base=editing?campaigns.find(x=>x.id===editing):{};
  const data={tipo:col?"colecao":"campanha",name,start,end,color:pickColor,mecanica:$("#f-mec").value.trim(),notas:$("#f-notes").value.trim(),extras:base?.extras||[],createdAt:base?.createdAt||new Date().toISOString()};
  const id=editing||db.collection("campaigns").doc().id;
  const ok=await commit([{path:"campaigns/"+id,data}],(editing?"editar ":"criar ")+name,(col?"Coleção ":"Campanha ")+(editing?"atualizada":"criada"));
  if(ok)closeModal();
}
async function deleteCamp(){
  if(!delArm){delArm=true;$("#f-del").textContent="Confirmar exclusão";return}
  const id=editing;
  const c=campaigns.find(x=>x.id===id);
  const ops=[{path:"campaigns/"+id,data:null}].concat(Object.keys(statusMap).filter(sid=>sid.startsWith(id+"__")).map(sid=>({path:"status/"+sid,data:null})));
  closeModal();await commit(ops,"excluir "+(c?c.name:""),"Excluída — use Desfazer se foi sem querer");
}

  if(d.xdur){const v=Math.max(1,Math.round(Number(el.value)||1));setStatus(d.xdur,{dur:v});return}
  if(d.xdue){if(el.value)setStatus(d.xdue,{due:el.value});return}
  if(d.xstart){const k=allTasks().find(z=>z.sid===d.xstart);if(!k||!el.value)return;const nd=diff(k.due,parseD(el.value));if(nd<1){toast("O início precisa ser antes da entrega");render();return}setStatus(d.xstart,{dur:nd});return}
  if(d.owner){setStatus(d.owner,{owner:el.value==="__def"?null:el.value,owners:null});return}
  if(d.cto!==undefined){const t=cfgDraft.tasks[Number(d.cto)];const s2=new Set(defOwners(t));el.checked?s2.add(d.pid):s2.delete(d.pid);t.owners=[...s2];t.owner=t.owners[0]||"";markDirty();return}
  if(d.cco!==undefined){const t=cfgDraft.col[Number(d.cco)];const s2=new Set(t.owners||[]);el.checked?s2.add(d.pid):s2.delete(d.pid);t.owners=[...s2];markDirty();return}
  if(d.cc!==undefined){const t=cfgDraft.col[Number(d.cc)];t[d.k]=el.type==="checkbox"?el.checked:el.value;markDirty();return}
  if(d.due){if(el.value){openMenu=null;setStatus(d.due,{due:el.value})}return}
  if(d.cp!==undefined){cfgDraft.people[Number(d.cp)][d.k]=el.value;markDirty();return}
  if(d.ct!==undefined){const t=cfgDraft.tasks[Number(d.ct)];t[d.k]=el.type==="checkbox"?el.checked:el.value;markDirty();return}
});
function markDirty(){cfgDirty=true;const sb=$("#cfg-savebar");if(sb)sb.innerHTML=saveBarHtml()}
function saveBarHtml(){return `${cfgDirty?`<span class="small" style="color:var(--soon);font-weight:700">Alterações não salvas</span><button class="btn ghost" id="cfg-reset" type="button">Descartar</button>`:""}<button class="btn primary" id="cfg-save" type="button" ${cfgDirty?"":"disabled"}>Salvar equipe e modelos</button>`}
document.addEventListener("input",e=>{const d=e.target.dataset;
  const tid=e.target.id;if(tid==="ee-dur"||tid==="ee-start"||tid==="ee-due"){const S=$("#ee-start"),U=$("#ee-dur"),E=$("#ee-due");if(S&&U&&E&&E.value){const ed=parseD(E.value);
    if(tid==="ee-start"&&S.value){const n=diff(ed,parseD(S.value));if(n>=1)U.value=n}
    else{const n=Math.max(1,Math.round(Number(U.value)||1));S.value=iso(addDays(ed,-n))}}}
  if(d.cp!==undefined){cfgDraft.people[Number(d.cp)][d.k]=e.target.value;if(!cfgDirty)markDirty()}
  if(d.ct!==undefined&&e.target.type!=="checkbox"){cfgDraft.tasks[Number(d.ct)][d.k]=e.target.value;if(!cfgDirty)markDirty()}
  if(d.cc!==undefined&&e.target.type!=="checkbox"){cfgDraft.col[Number(d.cc)][d.k]=e.target.value;if(!cfgDirty)markDirty()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="camp-form"){saveModal();return}
  if(f.dataset.etsave){const sid=f.dataset.etsave;const k=allTasks().find(z=>z.sid===sid);if(!k)return;
    const col=isCol(k.camp),name=$("#ee-name").value.trim(),e0=parseD($("#ee-due").value),s0=col?parseD($("#ee-start").value):e0;
    if(!name||!s0||!e0){toast(col?"Preencha nome, início e entrega":"Preencha nome e prazo");return}
    const dur=col?Math.round(Number($("#ee-dur").value)||diff(e0,s0)):k.dur;if(col&&dur<1){toast("A duração precisa ser de pelo menos 1 dia");return}
    const owners=[...document.querySelectorAll("[data-eeo]:checked")].map(i=>i.dataset.eeo);
    if(!owners.length){toast("Escolha pelo menos um responsável");return}
    const obs=($("#ee-obs")?.value||"").trim();
    etEdit=null;
    if(k.tpl.src==="x"){const [cid,key]=sid.split("__");const c=campaigns.find(x=>x.id===cid);
      const anc=k.tpl.anchor==="fim"?parseD(c.end):parseD(c.start);
      const extras=(c.extras||[]).map(x=>x.key===key?Object.assign({},x,{name,days:diff(anc,e0),dur,owners,owner:owners[0],obs}):x);
      group("editar “"+shortName(name)+"”",()=>{setStatus(sid,{due:null,dur:null,name:null,owners:null,owner:null,obs:null});saveExtras(cid,extras,"Salvo")});}
    else{const patch={obs:obs||null,name:name!==k.tpl.name?name:null,due:iso(e0)!==iso(k.custom?addDays(k.due,0):k.due)||k.custom?iso(e0):null,owners,owner:null};if(col)patch.dur=dur;setStatus(sid,patch,"editar “"+shortName(name)+"”").then(ok=>ok&&toast("Salvo"))}
    return}
  if(f.dataset.addet){const cid=f.dataset.addet,c=campaigns.find(x=>x.id===cid);const name=$("#ae-name").value.trim();const s0=parseD($("#ae-start").value),e0=parseD($("#ae-due").value);
    if(!name||!s0||!e0){toast("Preencha nome, início e entrega");return}
    const dur=diff(e0,s0);if(dur<1){toast("A entrega precisa ser depois do início");return}
    const owners=[...document.querySelectorAll("[data-aeo]:checked")].map(i=>i.dataset.aeo);
    const extras=(c.extras||[]).concat([{key:"x"+rid(),name,days:diff(parseD(c.start),e0),dur,anchor:"lanc",owners,owner:owners[0]||"",phase:"colecao"}]);
    saveExtras(cid,extras,"Etapa adicionada","adicionar etapa “"+shortName(name)+"”");return}
  if(f.dataset.addx){const cid=f.dataset.addx;const name=$("#ax-name-"+cid).value.trim();if(!name)return;
    const c=campaigns.find(x=>x.id===cid);const extras=(c.extras||[]).concat([{key:"x"+rid(),name,days:Number($("#ax-days-"+cid).value||0),anchor:isCol(c)?"lanc":"inicio",owner:$("#ax-owner-"+cid).value,phase:isCol(c)?"colecao":"execucao"}]);
    addxOpen=null;saveExtras(cid,extras,"Tarefa adicionada","adicionar tarefa “"+shortName(name)+"”");}
});
document.addEventListener("keydown",e=>{const inField=e.target.closest&&e.target.closest("input,textarea,select");
  if((e.ctrlKey||e.metaKey)&&!inField&&(e.key==="z"||e.key==="Z"||e.key==="y")){e.preventDefault();if(e.key==="y"||e.shiftKey)redo();else undo();return}
  if(e.key==="Escape"){if(!$("#overlay").hidden)closeModal();else if(openMenu){openMenu=null;render()}}});
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});

/* ---------- boot ---------- */
const INBOX="pintamemais@gmail.com";
function teamDone(sid){const k=allTasks().find(x=>x.sid===sid);if(!k)return;
  const subj="Feito: "+k.name+" — "+k.camp.name;
  const body="FEITO "+sid+"\n\nTarefa: "+k.name+"\n"+(isCol(k.camp)?"Coleção":"Campanha")+": "+k.camp.name+"\n\n(É só enviar este e-mail como está. Envie do seu e-mail cadastrado na equipe. A tarefa aparece como feita no calendário na próxima atualização.)";
  location.href="mailto:"+INBOX+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  toast("Abrindo seu e-mail — é só enviar")}
function teamChrome(){["#undo","#redo","#new-col","#new-camp","#export-team"].forEach(x=>{const b=$(x);if(b)b.hidden=true});
  document.querySelectorAll('.tab[data-view="cobrancas"],.tab[data-view="config"]').forEach(b=>b.hidden=true);
  if(view==="cobrancas"||view==="config")view="calendario";document.title="Calendário Pinta Me · Equipe"}
async function exportTeam(){
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
  if(!dl||!SRC||!SRC.js){toast("Não foi possível gerar o arquivo aqui");return}
  const snap={geradoEm:new Date().toISOString(),campaigns,status:statusMap,team:team.map(p=>({id:p.id,name:p.name,role:p.role||""})),modelo:templates,modeloColecao:colTemplates};
  const json=JSON.stringify(snap).replace(/</g,"\\u003c");
  const fonts='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">';
  const html='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Calendário Pinta Me · Equipe</title>'+fonts+SRC.css+'</head><body>'+SRC.body+'<script>window.__PM_SNAP__='+json+'<\/script><script>'+SRC.js+'<\/script></body></html>';
  try{await dl.save({filename:"index.html",data:html});toast("Arquivo gerado — agora é só subir no GitHub")}catch(e){if(!e||e.code!=="declined")toast("Não foi possível gerar o arquivo")}}
$("#export-team").addEventListener("click",exportTeam);
function statusLine(){
  const el=$("#status-line");
  if(TEAM){if(!SNAP){el.textContent="Carregando…";return}const g=new Date(SNAP.geradoEm);el.textContent="Versão da equipe · atualizada em "+g.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" às "+g.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+" · terminou uma tarefa? Clique no círculo ao lado dela para avisar por e-mail";return}
  if(!db){el.textContent=ready?"Abra este painel pelo Claude para ver e salvar os dados da equipe.":"Carregando…";return}
  const nc=campaigns.filter(isCol).length,np=campaigns.length-nc;
  el.textContent=`${np} campanha${np===1?"":"s"} · ${nc} coleç${nc===1?"ão":"ões"} · ${team.length} pessoas · atualiza ao vivo para todo o time${canWrite?"":" · somente leitura"}`;
}
function maybeRender(){if(got.c&&got.s&&got.t&&got.m&&got.k){ready=true;statusLine();render()}}
render();
function loadSnap(){campaigns=SNAP.campaigns||[];statusMap=SNAP.status||{};team=SNAP.team||[];templates=SNAP.modelo||[];colTemplates=SNAP.modeloColecao||[];for(const k in got)got[k]=true;ready=true;statusLine();render()}
if(TEAM){teamChrome();
  if(SNAP)loadSnap();
  else fetch(SNAP_URL+"?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{SNAP=j;loadSnap()}).catch(()=>{$("#status-line").textContent="Não foi possível carregar os dados do calendário. Recarregue a página."})}
else (async()=>{
  const cl=window.claude;
  db=cl&&cl.use?await cl.use("db"):null;
  ready=true;
  if(!db){statusLine();render();return}
  try{const u=await cl.use("user");if(u){const can=await u.can("data.write");if(can===false)canWrite=false}}catch(e){}
  if(canWrite)$("#export-team").hidden=false;
  const onErr=()=>{toast("Conexão perdida — recarregue a página")};
  db.collection("campaigns").onSnapshot(s=>{campaigns=s.docs.map(d=>Object.assign({id:d.id},d.data()));got.c=true;maybeRender()},onErr);
  db.collection("status").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());statusMap=m;got.s=true;maybeRender()},onErr);
  db.doc("config/equipe").onSnapshot(s=>{team=(s.exists&&s.data().people)||[];got.t=true;maybeRender()},onErr);
  db.doc("config/modelo").onSnapshot(s=>{templates=(s.exists&&s.data().tasks)||[];got.m=true;maybeRender()},onErr);
  db.doc("config/modeloColecao").onSnapshot(s=>{colTemplates=(s.exists&&s.data().tasks)||[];got.k=true;maybeRender()},onErr);
})();
})();
</script></body></html>
